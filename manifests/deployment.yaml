apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/part-of: cartgrid-commerce
spec:
  replicas: 2
  minReadySeconds: 0
  progressDeadlineSeconds: 90
  # Recreate: on a 2-CPU node a rolling update needs room for an extra pod while
  # an old one still holds its request; that never fits and the rollout freezes.
  # Replacing pods one-for-one keeps the capacity puzzle to the planted one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
      app.kubernetes.io/instance: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-api
        app.kubernetes.io/instance: primary
        app.kubernetes.io/component: reservations
        app.kubernetes.io/part-of: cartgrid-commerce
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: inventory-api
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              echo "inventory-api boot sequence started"
              sleep "${STARTUP_SECONDS}"
              echo "serving reservation API on ${LISTEN_PORT:-9090}"
              exec httpd -f -p "${LISTEN_PORT:-9090}" -h /www
          env:
            - name: LISTEN_PORT
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-runtime
                  key: LISTEN_PORT
                  optional: true
            - name: STARTUP_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-runtime
                  key: STARTUP_SECONDS
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: diagnostics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/reservations/health
              port: diagnostics
            initialDelaySeconds: 1
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/v1/reservations/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 1100m
              memory: 256Mi
            limits:
              cpu: 1200m
              memory: 384Mi
          volumeMounts:
            - name: web-content
              mountPath: /www
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: inventory-api-runtime
            items:
              - key: health-response
                path: api/v1/reservations/health
              - key: index-response
                path: index.html
