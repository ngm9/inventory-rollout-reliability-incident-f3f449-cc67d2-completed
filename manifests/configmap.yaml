apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-api-runtime
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-api
data:
  HTTP_PORT: "8080"
  STARTUP_SECONDS: "12"
  health-response: |
    {"status":"ok","service":"inventory-api","capability":"reservations"}
  index-response: |
    inventory reservation service
