apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/part-of: cartgrid-commerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/component: reservation-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
